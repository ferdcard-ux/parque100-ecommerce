<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c62828">
    <title>Acceso autorizado - Tienda Parque 100</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f5; color: #212121; font: 16px system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e5e7eb; border-radius: 24px; background: white; box-shadow: 0 16px 40px #00000012; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { color: #555; line-height: 1.5; }
      label { display: block; margin: 16px 0 6px; font-weight: 600; }
      input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; }
      button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 10px; background: #c62828; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      [role="alert"] { color: #b91c1c; }
      .note { margin-top: 18px; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Acceso autorizado</h1>
      <p>Este sitio académico es de uso exclusivo para aprendices responsables del desarrollo, instructor, compañeros de estudio y personal previamente autorizado.</p>
      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="50" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="error" role="alert" aria-live="polite" hidden></p>
        <button id="submit" type="submit">Ingresar</button>
      </form>
      <p class="note">No hay registro público. Solicita al responsable que cree tu cuenta y te autorice.</p>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const error = document.getElementById('error');
      const submit = document.getElementById('submit');
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('next') || '/';
      const destination = new URL(requested, window.location.origin);
      const target = destination.origin === window.location.origin
        && !destination.pathname.startsWith('/access.html')
        ? `${destination.pathname}${destination.search}${destination.hash}` : '/';
      if (params.get('denied') === '1') {
        error.textContent = 'No se autorizó el acceso. Contacta al responsable del sitio.';
        error.hidden = false;
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;
        submit.disabled = true;
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              Correo: form.elements.email.value.trim(),
              Contrasena: form.elements.password.value,
            }),
          });
          const user = await response.json().catch(() => null);
          if (!response.ok || !user || typeof user.token !== 'string') {
            throw new Error('Credenciales inválidas o cuenta sin autorización. Solicita acceso al responsable.');
          }
          const role = user.rol === 'admin' ? 'admin'
            : ['domiciliario', 'empleado'].includes(user.rol) ? 'domiciliario' : 'cliente';
          const name = String(user.nombre || '').split(' ');
          const session = {
            id: user.id,
            firstName: name[0] || '',
            lastName: name.slice(1).join(' '),
            email: user.correo,
            isAdmin: role === 'admin',
            role,
            photo: user.foto || null,
            token: user.token,
          };
          localStorage.setItem('p100-session', JSON.stringify(session));
          localStorage.setItem('p100-sessions', JSON.stringify([session]));
          localStorage.setItem('p100-active-session', JSON.stringify(session.id));
          localStorage.setItem('p100-token', user.token);
          window.location.replace(target);
        } catch (cause) {
          error.textContent = cause instanceof Error ? cause.message : 'No fue posible iniciar sesión.';
          error.hidden = false;
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
